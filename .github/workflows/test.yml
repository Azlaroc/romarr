name: Build & Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.x', cache: false, check-latest: true}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd. Run 'gofmt -w .' locally:"
            echo "$unformatted"
            exit 1
          fi
      - name: go build
        run: go build -o gamarr ./cmd/gamarr/
      - name: install rom-converto (pinned)
        # Same asset + sha256 the image bakes, so the internal/converto smoke
        # conversion actually runs here instead of skipping. Static-musl → runs
        # on the glibc runner.
        run: |
          set -euo pipefail
          url=https://github.com/DevYukine/rom-converto/releases/download/v0.17.0/rom-converto-cli-linux-x64-musl
          sha=24fc93e8403121aa9f39483e22ffe9f330f6a8a65db865b464ab1770600aac54
          curl -fSL "$url" -o /tmp/rom-converto
          echo "$sha  /tmp/rom-converto" | sha256sum -c -
          sudo install -m 0755 /tmp/rom-converto /usr/local/bin/rom-converto
          rom-converto --version
      - name: go test (race)
        run: go test ./... -v -count=1 -race
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: smoke test — binary boots and responds
        run: |
          mkdir -p /tmp/smoke-data
          GAMARR_PORT=15001 \
          DATA_DIR=/tmp/smoke-data \
            ./gamarr > /tmp/smoke.log 2>&1 &
          SMOKE_PID=$!
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:15001/api/health; then
              echo "binary up after ${i}*500ms"
              break
            fi
            sleep 0.5
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:15001/api/health; then
            echo "::error::binary failed to respond within 15s"
            cat /tmp/smoke.log
            kill $SMOKE_PID 2>/dev/null
            exit 1
          fi
          # Confirm the new Torznab + OpenAPI surfaces are reachable.
          curl -sf http://127.0.0.1:15001/api/openapi.json > /dev/null \
            || { echo "::error::/api/openapi.json failed"; cat /tmp/smoke.log; kill $SMOKE_PID 2>/dev/null; exit 1; }
          curl -sf "http://127.0.0.1:15001/torznab/api?t=caps" > /dev/null \
            || { echo "::error::/torznab/api?t=caps failed"; cat /tmp/smoke.log; kill $SMOKE_PID 2>/dev/null; exit 1; }
          kill $SMOKE_PID 2>/dev/null
          if grep -qiE "panic|fatal" /tmp/smoke.log; then
            echo "::error::panic/fatal in boot log:"
            cat /tmp/smoke.log
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t gamarr:ci .

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.x', cache: false, check-latest: true}
      # Build the real React UI so the binary embeds it (the e2e journey drives
      # the actual SPA). The other jobs compile against the web/dist/.gitkeep
      # placeholder and need no Node.
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/frontend/package-lock.json}
      - name: build frontend
        run: npm ci && npm run build
        working-directory: web/frontend
      - name: build binary
        run: go build -o /tmp/gamarr ./cmd/gamarr/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: install e2e deps
        run: |
          pip install -r e2e/requirements.txt
          playwright install --with-deps chromium
      - name: e2e user journey (hermetic — stubbed services, real browser)
        env:
          GAMARR_E2E_BIN: /tmp/gamarr
        run: pytest e2e/ -v
      - name: server log on failure
        if: failure()
        run: cat /tmp/pytest-of-*/pytest-*/data*/gamarr.log 2>/dev/null || true
